<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwaBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="pwaPinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="pwaPinGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#EA580C" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Fundo Dark Slate Total (512x512 para Maskable Icon) -->
  <rect width="512" height="512" fill="url(#pwaBgGrad)" />

  <!-- Pin Oficial Repara RV Centralizado na Safe Zone PWA -->
  <g transform="translate(256, 250) scale(3.1) translate(-50, -52)" filter="url(#pwaPinGlow)">
    <!-- Base / Pin de Localização -->
    <path d="M50 5 C28 5 10 23 10 45 C10 70 45 98 50 102 C55 98 90 70 90 45 C90 23 72 5 50 5 Z" 
          fill="url(#pwaPinGrad)" />

    <!-- Centro Negativo: Silhueta estilizada de chave/casa -->
    <circle cx="50" cy="40" r="17" fill="#0F172A" />
    <circle cx="50" cy="40" r="8" fill="url(#pwaPinGrad)" />
    <rect x="47" y="46" width="6" height="18" rx="3" fill="#0F172A" />
    <path d="M50 28 L53 37 L48 37 L51 46 L45 39 L49 39 Z" fill="#FFFFFF" opacity="0.95" />
  </g>
</svg>
